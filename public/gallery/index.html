<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Photo Gallery - Easy Premium</title>
    <meta name="description" content="Easy Premium Photo Gallery">
    <link rel="canonical" href="https://www.easy-premium.com">
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/8701/8701941.png">

    <!-- FONT AWESOME FOR ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ========== গ্লোবাল স্টাইল ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Noto Sans Bengali', sans-serif;
            -webkit-tap-highlight-color: transparent;
            color: #fff;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #121230 50%, #1a1a3a 100%);
            background-color: #0a0a1a;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* স্ক্রলবার হাইড করা */
        ::-webkit-scrollbar { display: none; }
        html { scrollbar-width: none; -ms-overflow-style: none; }

        /* ========== হেডার ========== */
        .header {
            background: rgba(10, 10, 26, 0.95);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            width: 100%;
            gap: 10px;
            border-bottom: none !important;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 200px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: transform 0.3s;
            flex-shrink: 0;
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .logo-image-container {
            width: 45px;
            height: 45px;
            min-width: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3);
            transition: all 0.3s;
            border-radius: 8px;
            background: white;
            padding: 5px;
        }

        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }
        
        .logo-main {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ff9800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        
        .logo-sub {
            font-size: 0.75rem;
            font-weight: 600;
            color: #00bcd4;
            letter-spacing: 0.3px;
            margin-top: 2px;
            white-space: nowrap;
        }

        /* ================== More Button Style ================== */
        .more-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ff9800;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            min-width: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            padding: 0;
            flex-shrink: 0;
            margin-left: auto;
            color: #ff9800;
        }
        .more-btn:hover {
            background: rgba(255, 152, 0, 0.2);
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.4);
            transform: scale(1.05);
        }
        .more-btn svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s;
        }

        /* ========== গ্যালারি গ্রিড ========== */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px 5px;
            flex: 1; 
            width: 100%;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 4px;
            padding: 4px;
            padding-bottom: 30px; 
        }

        .photo-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1; 
            overflow: hidden;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            opacity: 0; 
            transition: opacity 0.4s ease-in-out; 
        }

        .photo-item img.loaded {
            opacity: 1; 
        }

        .photo-item:hover img {
            transform: scale(1.05);
            transition: transform 0.3s ease;
        }

        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 6px;
                padding: 6px;
            }
        }

        /* ========== ফুটার ========== */
        .footer {
            background: rgba(10, 10, 26, 0.95);
            padding: 40px 20px 30px;
            text-align: center;
            width: 100%;
            margin-top: auto;
            position: relative;
            z-index: 10;
        }

        .footer-policy-links {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .footer-policy-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            padding: 5px 10px;
            transition: all 0.3s;
        }

        .footer-policy-links a:hover {
            color: #ff9800;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 0 auto 30px;
            flex-wrap: wrap;
            max-width: 500px;
        }

        .social-link {
            color: #fff;
            font-size: 1.5rem;
            transition: all 0.3s;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); 
            text-decoration: none;
        }

        .social-link:hover {
            background: rgba(255, 152, 0, 0.2);
            transform: translateY(-5px) scale(1.1);
        }

        .social-link:nth-child(1) i { color: #1877F2; }
        .social-link:nth-child(2) i { color: #E4405F; }
        .social-link:nth-child(3) i { color: #FF0000; }
        .social-link:nth-child(4) i { color: #000000; }
        .social-link:nth-child(5) i { color: #25D366; }
        .social-link:nth-child(6) i { color: #0088cc; }

        .copyright {
            color: #b0bec5;
            font-size: 0.85rem;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
        }

        .messenger-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #0084ff, #00b2ff);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 132, 255, 0.4);
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            animation: messengerPulse 2s infinite;
        }
        .messenger-float:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 30px rgba(0, 132, 255, 0.6);
        }
        .messenger-float i {
            color: white;
            font-size: 2rem;
        }
        @keyframes messengerPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 132, 255, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 132, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 132, 255, 0); }
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 10, 26, 0.98); 
            z-index: 2000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(255, 152, 0, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #ff9800;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            z-index: 2001;
            transition: color 0.3s;
        }

        .close-btn:hover { color: #fff; }

        .loading-spinner {
            text-align: center;
            padding: 50px;
            color: #ff9800;
            grid-column: 1 / -1;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #ff9800;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ================== সাইড ড্রয়ার CSS (আপনার মেইন সাইটের হুবহু ডিজাইন) ================== */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .side-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 50%; /* অর্ধেক স্ক্রিন */
            height: 100%;
            background: rgba(15, 15, 30, 0.98);
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.8);
            z-index: 2001;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            border-left: 2px solid #ff9800;
        }
        .side-drawer.active {
            transform: translateX(0);
        }
        .drawer-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 152, 0, 0.3);
            background: rgba(0, 0, 0, 0.3);
        }
        .drawer-header h2 {
            font-size: 1.2rem;
            color: #ff9800;
        }
        .close-drawer-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            padding: 5px;
        }
        .close-drawer-btn:hover {
            color: #ff5722;
            transform: rotate(90deg);
        }
        .drawer-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .drawer-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .drawer-btn:hover {
            background: rgba(255, 152, 0, 0.15);
            border-color: #ff9800;
            color: #ff9800;
            transform: translateX(-5px);
        }
        .drawer-btn i {
            font-size: 1.2rem;
            width: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .header { padding: 10px 12px; }
            .logo-main { font-size: 1.2rem; }
            .logo-sub { font-size: 0.7rem; }
        }

        @media (max-width: 480px) {
            .header { padding: 8px 10px; }
            .logo-image-container {
                width: 40px;
                height: 40px;
                min-width: 40px;
            }
            .logo-main { font-size: 1.1rem; }
            .logo-sub { font-size: 0.7rem; }
            .footer { padding: 30px 15px 80px; }
            .footer-policy-links { gap: 12px; }
            .social-links { gap: 10px; }
            .social-link { width: 45px; height: 45px; font-size: 1.3rem; }
            .messenger-float { bottom: 20px; right: 20px; width: 55px; height: 55px; }
            .copyright { font-size: 0.85rem; }
            .more-btn { margin-left: 0; }
        }
    </style>
</head>
<body>

    <!-- ================== Scripts ================== -->
    <script>
        // ================== Drawer Logic & Strict Back Button Block ==================
        const moreBtn = document.getElementById('moreBtn');
        const sideDrawer = document.getElementById('sideDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const closeDrawerBtn = document.getElementById('closeDrawerBtn');

        // পেজ লোড হওয়া মাত্রই একটি হিস্ট্রি স্টেট পুশ করা হচ্ছে যাতে ব্যাক বাটন কাজ না করে
        history.pushState({ page: 1 }, "", location.href);

        // ব্যাক বাটন প্রেস করলে যা হবে
        window.addEventListener('popstate', function(event) {
            // আবার স্টেট পুশ করে ইউজারকে পেজে আটকে রাখা হবে (ব্যাক করা নিষিদ্ধ)
            history.pushState({ page: 1 }, "", location.href);
            
            // যদি ড্রয়ার খোলা থাকে, তবে ব্যাক বাটনে শুধু ড্রয়ারটি বন্ধ হবে
            if (sideDrawer.classList.contains('active')) {
                sideDrawer.classList.remove('active');
                drawerOverlay.classList.remove('active');
            }
        });

        function openDrawer() {
            sideDrawer.classList.add('active');
            drawerOverlay.classList.add('active');
        }

        function closeDrawerUI() {
            sideDrawer.classList.remove('active');
            drawerOverlay.classList.remove('active');
        }

        moreBtn.addEventListener('click', openDrawer);
        closeDrawerBtn.addEventListener('click', closeDrawerUI);
        drawerOverlay.addEventListener('click', closeDrawerUI);

        // ================== গ্যালারি লজিক (অপরিবর্তিত) ==================
        const BASE_URL = "https://easy-premium.github.io/copyProdux/DATABASE/";
        const gallery = document.getElementById('gallery');
        const initialLoader = document.getElementById('initial-loader');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        let maxPhotoLimit = 0; 
        let currentPhotoId = 1;

        async function startGallery() {
            try {
                const maxResponse = await fetch(BASE_URL + 'max.txt');
                
                if (maxResponse.ok) {
                    const maxText = await maxResponse.text();
                    const cleanText = maxText.replace(/\s+/g, ''); 
                    maxPhotoLimit = parseInt(cleanText); 
                    
                    if (isNaN(maxPhotoLimit)) maxPhotoLimit = 0;
                } else {
                    maxPhotoLimit = 0; 
                }

                console.log("Max Limit Found:", maxPhotoLimit);

                if (maxPhotoLimit > 0) {
                    currentPhotoId = maxPhotoLimit; 
                    loadNextPhoto(); 
                } else {
                    if (initialLoader) initialLoader.style.display = 'none';
                    gallery.innerHTML = '<div style="text-align:center; padding:50px; color:#ff9800;">কোনো ছবি পাওয়া যায়নি (লিমিট ০)।</div>';
                }
            } catch (error) {
                console.error("Error:", error);
                if (initialLoader) initialLoader.style.display = 'none';
                gallery.innerHTML = '<div style="text-align:center; padding:50px; color:#ff9800;">সার্ভারে সমস্যা হচ্ছে, পরে আবার চেষ্টা করুন।</div>';
            }
        }

        async function loadNextPhoto() {
            if (currentPhotoId < 1) {
                return;
            }

            try {
                const response = await fetch(BASE_URL + 'image' + currentPhotoId + '.txt');

                if (currentPhotoId === maxPhotoLimit && initialLoader) {
                    initialLoader.style.display = 'none';
                }

                if (response.ok) {
                    const photoUrl = await response.text(); 
                    const cleanUrl = photoUrl.trim();

                    if (cleanUrl.length > 0) {
                        const div = document.createElement('div');
                        div.className = 'photo-item';
                        div.onclick = function() { openLightbox(cleanUrl); };

                        const img = document.createElement('img');
                        div.appendChild(img);
                        gallery.appendChild(div);

                        await new Promise((resolve) => {
                            img.onload = () => {
                                img.classList.add('loaded'); 
                                resolve(); 
                            };
                            img.onerror = () => {
                                div.style.display = 'none';
                                resolve(); 
                            };
                            img.src = cleanUrl;
                        });
                    }
                }
                
                currentPhotoId--;
                loadNextPhoto(); 
                
            } catch (error) {
                console.error("ছবি লোডে সমস্যা: ", error);
                currentPhotoId--;
                loadNextPhoto(); 
            }
        }

        startGallery();

        function openLightbox(imageUrl) {
            lightboxImg.src = imageUrl;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            // history.pushState({ lightbox: true }, ""); // গ্যালারির আগের লাইটবক্স লজিক আপনার মেইন পেজের ব্যাক-বাটন ব্লকের সাথে কনফ্লিক্ট করতে পারে, তাই এটি কমেন্ট আউট রাখা হলো
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
            lightboxImg.src = "";
        }

        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) closeLightbox();
        });
    </script>
</body>
</html>
