        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .image-box {
            background: #fafafa;
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 22px;
        }
        img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        button {
            background: linear-gradient(135deg, #007bff, #0056d6);
            color: #fff;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.35);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 123, 255, 0.5);
        }
        button:active {
            transform: translateY(0);
        }
    </style>

        <button onclick="downloadImage()">⬇️ ইমেজ ডাউনলোড করুন</button>
    </div>

    <script>
        function downloadImage() {
            const img = document.getElementById('myImage');
            
            // চাইলে এখানে ফাইলের নাম পরিবর্তন করুন
            const fileName = 'my-image.png';

            const link = document.createElement('a');
            link.href = img.src;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>
</html>
