<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>মোবাইল রিচার্জ - Easy Premium</title>
<meta name="description" content="সব অপারেটরে মোবাইল রিচার্জ - GP, Robi, Banglalink, Airtel, Teletalk">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8701/8701941.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --bg1:#0a0a1a; --bg2:#121230; --bg3:#1a1a3a;
  --orange:#ff9800; --cyan:#00bcd4; --green:#4caf50; --red:#f44336;
  --card:rgba(20,20,40,.9); --muted:#b0bec5;
  --grad-btn:linear-gradient(45deg,#ff9800,#ff5722);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Noto Sans Bengali',sans-serif;-webkit-tap-highlight-color:transparent;color:#fff}
html{scroll-behavior:smooth;overflow-x:hidden;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;
  padding-bottom:40px;
}

/* ---------- Header ---------- */
.header{
  background:rgba(10,10,26,.95);padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:1000;backdrop-filter:blur(10px);
  box-shadow:0 5px 15px rgba(0,0,0,.5);
}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-image-container{
  width:42px;height:42px;border-radius:8px;background:#fff;padding:5px;
  box-shadow:0 5px 15px rgba(255,152,0,.3);
}
.logo-image{width:100%;height:100%;object-fit:contain}
.logo-main{font-size:1.15rem;font-weight:800;color:var(--orange);letter-spacing:.5px}
.logo-sub{font-size:.7rem;color:var(--cyan);font-weight:600}
.back-btn{
  padding:8px 14px;border-radius:20px;border:1px solid var(--orange);
  background:transparent;color:var(--orange);font-size:.85rem;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:600;
}
.back-btn:hover{background:rgba(255,152,0,.15)}

/* ---------- Layout ---------- */
.container{max-width:560px;margin:0 auto;padding:20px 16px}
.page-title{
  text-align:center;font-size:1.6rem;font-weight:800;color:var(--orange);
  margin-bottom:6px;line-height:1.3;
}
.page-sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:22px}

/* ---------- Balance Strip ---------- */
.balance-strip{
  background:linear-gradient(135deg,rgba(255,152,0,.15),rgba(0,188,212,.08));
  border:1px solid rgba(255,152,0,.35);border-radius:14px;
  padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;
}
.balance-strip .label{font-size:.8rem;color:var(--muted);font-weight:600}
.balance-strip .value{font-size:1.3rem;font-weight:800;color:var(--orange);margin-top:2px}
.balance-strip .value small{font-size:.75rem;color:var(--muted);font-weight:500;margin-left:4px}
.refresh-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--orange);
  background:transparent;color:var(--orange);cursor:pointer;font-size:1rem;
  transition:.3s;
}
.refresh-btn:hover{background:rgba(255,152,0,.15);transform:rotate(180deg)}
.refresh-btn.loading{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Form Card ---------- */
.card{
  background:var(--card);border-radius:16px;padding:22px 20px;
  border:1px solid rgba(255,255,255,.06);margin-bottom:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.form-label{
  display:block;font-size:.85rem;color:var(--muted);font-weight:600;
  margin-bottom:8px;letter-spacing:.3px;
}
.input-wrap{position:relative;margin-bottom:16px}
.input{
  width:100%;padding:15px 15px 15px 48px;border-radius:12px;
  border:2px solid rgba(255,152,0,.4);background:rgba(0,0,0,.45);
  color:#fff;font-size:1.05rem;font-weight:600;outline:none;transition:.25s;
  letter-spacing:.5px;
}
.input:focus{
  border-color:var(--orange);background:rgba(0,0,0,.65);
  box-shadow:0 0 0 4px rgba(255,152,0,.15);
}
.input::placeholder{color:rgba(255,255,255,.35);font-weight:400;letter-spacing:0}
.input-icon{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  color:var(--orange);font-size:1.05rem;pointer-events:none;
}
.input-wrap.amount .input{padding-left:48px;font-size:1.2rem}

/* ---------- Operator Badge ---------- */
.operator-badge{
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  font-size:.85rem;font-weight:700;margin-top:-8px;margin-bottom:16px;
  transition:.3s;width:fit-content;
}
.operator-badge.detected{
  background:rgba(76,175,80,.15);border-color:var(--green);color:var(--green);
}
.operator-badge.error{
  background:rgba(244,67,54,.15);border-color:var(--red);color:var(--red);
}
.operator-badge i{font-size:.9rem}
.op-dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* Operator specific colors */
.op-GP{background:rgba(0,180,216,.15);border-color:#00b4d8;color:#00b4d8}
.op-RB{background:rgba(233,30,99,.15);border-color:#e91e63;color:#e91e63}
.op-BL{background:rgba(255,87,34,.15);border-color:#ff5722;color:#ff5722}
.op-AT{background:rgba(255,23,68,.15);border-color:#ff1744;color:#ff1744}
.op-TT{background:rgba(76,175,80,.15);border-color:#4caf50;color:#4caf50}
.op-BT{background:rgba(156,39,176,.15);border-color:#9c27b0;color:#9c27b0}

/* ---------- Quick Amounts ---------- */
.quick-amounts{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;
}
.amt-chip{
  padding:12px 6px;border-radius:10px;border:2px solid rgba(255,152,0,.35);
  background:rgba(0,0,0,.35);color:#fff;font-weight:700;font-size:1rem;
  cursor:pointer;transition:.2s;font-family:inherit;
}
.amt-chip:hover{border-color:var(--orange);background:rgba(255,152,0,.12)}
.amt-chip.active{
  background:var(--grad-btn);border-color:transparent;
  box-shadow:0 4px 15px rgba(255,152,0,.4);
}

/* ---------- Main Recharge Button ---------- */
.recharge-btn{
  width:100%;padding:16px;border:none;border-radius:12px;
  background:var(--grad-btn);color:#fff;font-size:1.05rem;font-weight:800;
  letter-spacing:.5px;cursor:pointer;transition:.3s;text-transform:uppercase;
  box-shadow:0 8px 20px rgba(255,87,34,.35);
}
.recharge-btn:hover:not(:disabled){
  transform:translateY(-2px);box-shadow:0 12px 25px rgba(255,87,34,.5);
}
.recharge-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.recharge-btn .spinner{
  display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;
  vertical-align:middle;margin-right:8px;
}

/* ---------- Result Box ---------- */
.result-box{
  display:none;padding:16px;border-radius:12px;margin-top:16px;
  font-size:.9rem;line-height:1.55;
}
.result-box.show{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.result-box.success{background:rgba(76,175,80,.12);border:1px solid var(--green)}
.result-box.error{background:rgba(244,67,54,.12);border:1px solid var(--red)}
.result-box.info{background:rgba(0,188,212,.12);border:1px solid var(--cyan)}
.result-box .rb-title{font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.result-box.success .rb-title{color:var(--green)}
.result-box.error .rb-title{color:var(--red)}
.result-box.info .rb-title{color:var(--cyan)}
.result-box .rb-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.result-box .rb-row:last-child{border-bottom:none}
.result-box .rb-row span:first-child{color:var(--muted);font-size:.83rem}
.result-box .rb-row span:last-child{font-weight:700}

/* ---------- History ---------- */
.section-title{
  font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.section-title i{color:var(--orange)}
.history-list{display:flex;flex-direction:column;gap:10px}
.history-item{
  background:var(--card);border-radius:12px;padding:14px 16px;
  border-left:4px solid var(--orange);display:flex;justify-content:space-between;
  align-items:center;gap:12px;
}
.history-item.ok{border-left-color:var(--green)}
.history-item.fail{border-left-color:var(--red)}
.history-item .hi-left{flex:1;min-width:0}
.history-item .hi-num{font-weight:700;font-size:.95rem}
.history-item .hi-meta{font-size:.75rem;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.history-item .hi-amt{font-weight:800;color:var(--orange);font-size:1rem;white-space:nowrap}
.empty-history{
  text-align:center;color:var(--muted);padding:24px 12px;font-size:.9rem;
  background:var(--card);border-radius:12px;
}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(150%);
  background:rgba(20,20,40,.98);border:1px solid var(--orange);color:#fff;
  padding:14px 22px;border-radius:30px;font-size:.9rem;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:9999;
  transition:transform .35s cubic-bezier(.4,1.4,.5,1);max-width:90vw;
  display:flex;align-items:center;gap:10px;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--green)}
.toast.err{border-color:var(--red)}

/* ---------- Responsive ---------- */
@media(max-width:480px){
  .page-title{font-size:1.35rem}
  .container{padding:16px 12px}
  .card{padding:18px 16px}
  .quick-amounts{gap:8px}
  .amt-chip{padding:11px 4px;font-size:.95rem}
  .input{font-size:1rem;padding:14px 14px 14px 44px}
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <a href="../index.html" class="logo">
    <div class="logo-image-container"><img src="https://cdn-icons-png.flaticon.com/512/8701/8701941.png" alt="Easy Premium" class="logo-image"></div>
    <div>
      <div class="logo-main">EASY PREMIUM</div>
      <div class="logo-sub">Mobile Recharge</div>
    </div>
  </a>
  <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> হোম</a>
</header>

<div class="container">

  <h1 class="page-title">মোবাইল রিচার্জ</h1>
  <p class="page-sub">GP · Robi · Banglalink · Airtel · Teletalk — সব সিমে রিচার্জ</p>

  <!-- Balance -->
  <div class="balance-strip">
    <div>
      <div class="label"><i class="fas fa-wallet"></i> আপনার ব্যালেন্স</div>
      <div class="value" id="balanceValue">— <small>৳</small></div>
    </div>
    <button class="refresh-btn" id="refreshBalance" title="রিফ্রেশ"><i class="fas fa-sync-alt"></i></button>
  </div>

  <!-- Recharge Form -->
  <div class="card">
    <label class="form-label">মোবাইল নম্বর <span style="color:var(--red)">*</span></label>
    <div class="input-wrap">
      <i class="fas fa-mobile-alt input-icon"></i>
      <input type="tel" id="numberInput" class="input" placeholder="01XXXXXXXXX" maxlength="11" inputmode="numeric" autocomplete="tel">
    </div>

    <div class="operator-badge" id="operatorBadge">
      <span class="op-dot"></span>
      <span>অপারেটর শনাক্ত হচ্ছে...</span>
    </div>

    <label class="form-label">রিচার্জ পরিমাণ (৳) <span style="color:var(--red)">*</span></label>
    <div class="quick-amounts">
      <button class="amt-chip" data-amt="20">৳২০</button>
      <button class="amt-chip" data-amt="50">৳৫০</button>
      <button class="amt-chip" data-amt="100">৳১০০</button>
      <button class="amt-chip" data-amt="200">৳২০০</button>
      <button class="amt-chip" data-amt="500">৳৫০০</button>
      <button class="amt-chip" data-amt="1000">৳১০০০</button>
    </div>
    <div class="input-wrap amount">
      <i class="fas fa-taka-sign input-icon"></i>
      <input type="tel" id="amountInput" class="input" placeholder="পরিমাণ লিখুন" inputmode="numeric">
    </div>

    <button class="recharge-btn" id="rechargeBtn" disabled>
      <span id="btnText">রিচার্জ করুন</span>
    </button>

    <div class="result-box" id="resultBox"></div>
  </div>

  <!-- History -->
  <h3 class="section-title"><i class="fas fa-history"></i> সাম্প্রতিক রিচার্জ</h3>
  <div class="history-list" id="historyList">
    <div class="empty-history">এখনো কোনো রিচার্জ করা হয়নি</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ⚙️ কনফিগারেশন — Vercel Serverless Proxy
   ============================================================
   ✅ api_key / api_pass আর এখানে নেই।
   ✅ সব credential Vercel Environment Variables এ।
   ✅ ব্রাউজার শুধু /api/proxy হিট করে।
   ============================================================ */
const API_BASE = '/api/proxy';

/* ============================================================
   🎯 অপারেটর ডিটেকশন (BD প্রিফিক্স ম্যাপ)
   ============================================================ */
const OPERATORS = {
  GP: { name: 'Grameenphone', prefixes: ['013','017'], color: '#00b4d8', icon: 'fa-signal' },
  RB: { name: 'Robi',         prefixes: ['016','018'], color: '#e91e63', icon: 'fa-signal' },
  BL: { name: 'Banglalink',   prefixes: ['014','019'], color: '#ff5722', icon: 'fa-signal' },
  AT: { name: 'Airtel',       prefixes: [],           color: '#ff1744', icon: 'fa-signal' },
  TT: { name: 'Teletalk',     prefixes: ['015'],       color: '#4caf50', icon: 'fa-signal' },
  BT: { name: 'BT',           prefixes: [],           color: '#9c27b0', icon: 'fa-signal' }
};

function detectOperator(number) {
  const n = (number || '').replace(/\D/g, '');
  if (n.length < 3) return null;
  const p = n.slice(0, 3);
  for (const code in OPERATORS) {
    if (OPERATORS[code].prefixes.includes(p)) return code;
  }
  return null;
}

/* ============================================================
   🔢 ইনপুট হেল্পার
   ============================================================ */
function cleanNumber(v){ return (v||'').replace(/\D/g,'').slice(0,11); }
function cleanAmount(v){ return (v||'').replace(/\D/g,'').slice(0,5); }
function isValidNumber(n){ return /^01[3-9]\d{8}$/.test(n); }

/* ============================================================
   🔔 Toast
   ============================================================ */
let toastTimer;
function showToast(msg, type='', ms=3000){
  const t = document.getElementById('toast');
  t.className = 'toast ' + type + ' show';
  t.innerHTML = `<i class="fas ${type==='ok'?'fa-check-circle':type==='err'?'fa-times-circle':'fa-info-circle'}"></i><span>${msg}</span>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), ms);
}

/* ============================================================
   🌐 API কল — proxy এর মাধ্যমে
   ============================================================
   এখানে endpoint কে query parameter হিসেবে পাঠানো হয়।
   যেমন: /api/proxy?endpoint=balance
        /api/proxy?endpoint=recharge&number=...&amount=...
   ============================================================ */
async function apiCall(endpoint, params = {}) {
  const url = new URL(API_BASE, window.location.origin);
  url.searchParams.set('endpoint', endpoint);   // ⭐ endpoint query তে

  for (const k in params) {
    url.searchParams.set(k, params[k]);
  }

  const res = await fetch(url.toString(), { method: 'GET' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

function makeRefid() {
  return 'EP' + Date.now() + Math.random().toString(36).slice(2,7).toUpperCase();
}

/* ============================================================
   💰 ব্যালেন্স
   ============================================================ */
async function fetchBalance(silent=false) {
  const btn = document.getElementById('refreshBalance');
  const val = document.getElementById('balanceValue');
  btn.classList.add('loading');
  try {
    const data = await apiCall('balance');
    if (data && data.status) {
      val.innerHTML = `${Number(data.balance).toFixed(2)} <small>৳</small>`;
      if (!silent) showToast('ব্যালেন্স আপডেট হয়েছে', 'ok');
    } else {
      val.innerHTML = '— <small>৳</small>';
      if (!silent) showToast(data?.message || 'ব্যালেন্স পাওয়া যায়নি', 'err');
    }
  } catch (e) {
    val.innerHTML = '— <small>৳</small>';
    if (!silent) showToast('সার্ভারের সাথে সংযোগ ব্যর্থ', 'err');
  } finally {
    btn.classList.remove('loading');
  }
}

/* ============================================================
   🧾 রেন্ডার রেজাল্ট
   ============================================================ */
function showResult(type, title, rows=[]) {
  const box = document.getElementById('resultBox');
  box.className = 'result-box show ' + type;
  const icon = type==='success'?'fa-check-circle':type==='error'?'fa-times-circle':'fa-info-circle';
  box.innerHTML = `
    <div class="rb-title"><i class="fas ${icon}"></i>${title}</div>
    ${rows.map(r => `<div class="rb-row"><span>${r.k}</span><span>${r.v}</span></div>`).join('')}
  `;
}

/* ============================================================
   📜 হিস্ট্রি
   ============================================================ */
const HISTORY_KEY = 'ep_recharge_history_v1';
function loadHistory(){
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch { return []; }
}
function saveHistory(list){
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0,20))); }
  catch {}
}
function addHistory(entry){
  const list = loadHistory();
  list.unshift(entry);
  saveHistory(list);
  renderHistory();
}
function renderHistory(){
  const list = loadHistory();
  const wrap = document.getElementById('historyList');
  if (!list.length) {
    wrap.innerHTML = '<div class="empty-history">এখনো কোনো রিচার্জ করা হয়নি</div>';
    return;
  }
  wrap.innerHTML = list.map(h => `
    <div class="history-item ${h.ok?'ok':'fail'}">
      <div class="hi-left">
        <div class="hi-num">${h.number}</div>
        <div class="hi-meta">
          <span><i class="fas fa-signal"></i> ${h.operator||'—'}</span>
          <span><i class="fas fa-clock"></i> ${h.time}</span>
        </div>
      </div>
      <div class="hi-amt">৳${h.amount}</div>
    </div>
  `).join('');
}

/* ============================================================
   🚀 রিচার্জ সাবমিট
   ============================================================ */
async function doRecharge(){
  const number = cleanNumber(document.getElementById('numberInput').value);
  const amount = cleanAmount(document.getElementById('amountInput').value);
  const operator = detectOperator(number);

  /* ভ্যালিডেশন */
  if (!isValidNumber(number)) { showToast('সঠিক ১১ ডিজিটের নম্বর দিন', 'err'); return; }
  if (!operator) { showToast('এই নম্বরের অপারেটর শনাক্ত করা যায়নি', 'err'); return; }
  const amt = parseInt(amount, 10);
  if (!amt || amt < 10) { showToast('সর্বনিম্ন ৳১০ রিচার্জ করা যাবে', 'err'); return; }
  if (amt > 5000) { showToast('সর্বোচ্চ ৳৫০০০ রিচার্জ করা যাবে', 'err'); return; }

  const btn = document.getElementById('rechargeBtn');
  const btnText = document.getElementById('btnText');
  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> প্রসেস হচ্ছে...';

  const refid = makeRefid();

  try {
    const data = await apiCall('recharge', {
      number, amount: amt, type: 'prepaid',
      operator, refid
    });

    if (data && data.status) {
      showResult('success', 'রিচার্জ সফল হয়েছে', [
        { k: 'নম্বর', v: number },
        { k: 'অপারেটর', v: OPERATORS[operator].name },
        { k: 'পরিমাণ', v: '৳' + amt },
        { k: 'ট্রানজেকশন আইডি', v: data.trxid || refid }
      ]);
      addHistory({ number, amount: amt, operator, ok: true, time: new Date().toLocaleString('bn-BD'), refid });
      document.getElementById('amountInput').value = '';
      document.querySelectorAll('.amt-chip').forEach(c=>c.classList.remove('active'));
      showToast('রিচার্জ সফল!', 'ok');
      fetchBalance(true);
    } else {
      showResult('error', 'রিচার্জ ব্যর্থ', [
        { k: 'কারণ', v: data?.message || 'অজানা ত্রুটি' },
        { k: 'নম্বর', v: number }
      ]);
      addHistory({ number, amount: amt, operator, ok: false, time: new Date().toLocaleString('bn-BD'), refid });
      showToast(data?.message || 'রিচার্জ ব্যর্থ', 'err');
    }
  } catch (e) {
    showResult('error', 'সংযোগ ব্যর্থ', [
      { k: 'কারণ', v: e.message || 'নেটওয়ার্ক সমস্যা' },
      { k: 'পরামর্শ', v: 'কিছুক্ষণ পরে আবার চেষ্টা করুন' }
    ]);
    showToast('সার্ভারে সংযোগ ব্যর্থ', 'err');
  } finally {
    btn.disabled = false;
    btnText.textContent = 'রিচার্জ করুন';
  }
}

/* ============================================================
   🎛️ UI ইভেন্ট বাইন্ডিং
   ============================================================ */
const numInput = document.getElementById('numberInput');
const amtInput = document.getElementById('amountInput');
const badge = document.getElementById('operatorBadge');
const btn = document.getElementById('rechargeBtn');

function updateOperatorBadge(){
  const num = cleanNumber(numInput.value);
  const op = detectOperator(num);
  badge.className = 'operator-badge';
  if (num.length < 3) {
    badge.innerHTML = '<span class="op-dot"></span><span>অপারেটর শনাক্ত হচ্ছে...</span>';
  } else if (op) {
    badge.classList.add('detected', 'op-' + op);
    badge.innerHTML = `<span class="op-dot"></span><span>${OPERATORS[op].name} (${op})</span>`;
  } else {
    badge.classList.add('error');
    badge.innerHTML = '<span class="op-dot"></span><span>অজানা অপারেটর</span>';
  }
  validateForm();
}

function validateForm(){
  const num = cleanNumber(numInput.value);
  const amt = parseInt(cleanAmount(amtInput.value), 10);
  const op  = detectOperator(num);
  btn.disabled = !(isValidNumber(num) && op && amt >= 10 && amt <= 5000);
}

numInput.addEventListener('input', e => {
  e.target.value = cleanNumber(e.target.value);
  updateOperatorBadge();
});

amtInput.addEventListener('input', e => {
  e.target.value = cleanAmount(e.target.value);
  document.querySelectorAll('.amt-chip').forEach(c=>{
    c.classList.toggle('active', parseInt(c.dataset.amt,10) === parseInt(e.target.value,10));
  });
  validateForm();
});

document.querySelectorAll('.amt-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.amt-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    amtInput.value = chip.dataset.amt;
    validateForm();
  });
});

btn.addEventListener('click', doRecharge);
document.getElementById('refreshBalance').addEventListener('click', ()=>fetchBalance(false));

/* ============================================================
   🏁 ইনিশিয়ালাইজ
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  updateOperatorBadge();
  renderHistory();
  fetchBalance(true);   // সাইলেন্ট ব্যালেন্স লোড
});
</script>
</body>
